<!DOCTYPE html>
<html lang="alt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ta strona została zajęta</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            background: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
            color: #171717;
        }

        .container {
            width: 90%;
            max-width: 720px;
            text-align: center;
            padding: 40px 20px;
        }

        .logo {
            width: 150px;
            height: 150px;
            object-fit: contain;
            margin-bottom: 35px;
        }

        h1 {
            margin: 0;
            font-size: 38px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .description {
            margin: 22px auto 0;
            max-width: 600px;
            font-size: 18px;
            line-height: 1.6;
            color: #555;
        }

        @media (max-width: 600px) {
            .logo {
                width: 120px;
                height: 120px;
                margin-bottom: 28px;
            }

            h1 {
                font-size: 28px;
            }

            .description {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <img
            src="yurashiry.github.io/-at/logo.jpeg"
            alt="Ministerstwo Rozwoju Cyfrowego"
            class="logo"
        >

        <h1>Ta strona została zajęta</h1>

        <p class="description">
            Ta strona została wydana przez Ministerstwo Rozwoju Cyfrowego.
        </p>

    </main>

</body>
</html>
